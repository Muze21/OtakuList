name: flutter_application_1
description: "Anime Tracker App with Simplified Clean Architecture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.10.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Router
  go_router: ^14.6.2

  # Code Generation / Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.19.0
  image_picker: ^1.0.0
  path_provider: ^2.1.0
  path: ^1.9.1
  file_picker: ^5.3.5

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generators
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

